# Loyiha nomi qat'iy belgilangan - serverdagi boshqa botlar (masalan slaydbot) bilan aralashmaydi
name: kinobot

services:
  # Lokal Telegram Bot API server - 2 GB gacha fayllarni qabul qilish uchun
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tgapi:/var/lib/telegram-bot-api

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LOCAL_API_URL: http://telegram-bot-api:8081
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - tgapi:/var/lib/telegram-bot-api
    depends_on:
      - telegram-bot-api
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tgapi:
